name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install clang-format 20
        run: |
          python -m pip install --upgrade pip
          python -m pip install "clang-format==20.1.8"
          clang-format --version
      - name: Check formatting
        run: python scripts/format_source.py --check

  windows-qt:
    name: Windows MSVC + Qt (Host + Clients)
    runs-on: windows-latest
    steps:
      - name: Checkout Volition
        uses: actions/checkout@v7
        with:
          path: Volition
      - name: Checkout MultiProcessShell
        uses: actions/checkout@v7
        with:
          repository: yanxijian/MultiProcessShell
          path: MultiProcessShell
      - name: Checkout QThemeEngine
        uses: actions/checkout@v7
        with:
          repository: yanxijian/QThemeEngine
          path: QThemeEngine
      - name: Checkout QFluentRibbon
        uses: actions/checkout@v7
        with:
          repository: yanxijian/QFluentRibbon
          path: QFluentRibbon
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Install Python protobuf (MPS FetchContent helpers)
        working-directory: MultiProcessShell
        run: python -m pip install -r clients/python/requirements.txt
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
          arch: win64_msvc2022_64
      - name: Cache FetchContent deps
        uses: actions/cache@v6
        with:
          path: Volition/build/_deps
          key: volition-deps-win-${{ hashFiles('Volition/CMakeLists.txt', 'Volition/cmake/**', 'MultiProcessShell/CMakeLists.txt', 'MultiProcessShell/cmake/**', 'MultiProcessShell/src/common/CMakeLists.txt') }}
      - name: Configure
        working-directory: Volition
        shell: cmd
        env:
          QTDIR: ${{ env.QT_ROOT_DIR }}
        run: |
          where cl
          where ninja
          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DVOLITION_DEV_EMBED_MPS=ON ^
            -DVOLITION_DEV_EMBED_QTE=ON ^
            -DVOLITION_DEV_EMBED_QFR=ON ^
            -DVOLITION_REQUIRE_PDFIUM=OFF ^
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
      - name: Build
        working-directory: Volition
        shell: cmd
        env:
          QTDIR: ${{ env.QT_ROOT_DIR }}
        run: cmake --build build --config Release
