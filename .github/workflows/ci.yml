name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install clang-format 20
        run: |
          python -m pip install --upgrade pip
          python -m pip install "clang-format==20.1.8"
          clang-format --version
      - name: Check formatting
        run: python scripts/format_source.py --check

  windows-qt:
    name: Windows MSVC + Qt (Host + Clients)
    runs-on: windows-latest
    steps:
      - name: Checkout Volition
        uses: actions/checkout@v7
        with:
          path: Volition
      - name: Checkout MultiProcessShell
        uses: actions/checkout@v7
        with:
          repository: yanxijian/MultiProcessShell
          path: MultiProcessShell
      - name: Checkout QThemeEngine
        uses: actions/checkout@v7
        with:
          repository: yanxijian/QThemeEngine
          path: QThemeEngine
      - name: Checkout QFluentRibbon
        uses: actions/checkout@v7
        with:
          repository: yanxijian/QFluentRibbon
          path: QFluentRibbon
      - name: Checkout AbseilPin
        uses: actions/checkout@v7
        with:
          repository: yanxijian/AbseilPin
          path: AbseilPin
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: seanmiddleditch/gha-setup-ninja@v6
      - name: Install Python protobuf (MPS FetchContent helpers)
        working-directory: MultiProcessShell
        run: python -m pip install -r clients/python/requirements.txt
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
          arch: win64_msvc2022_64
      - name: Cache AbseilPin prefix
        uses: actions/cache@v6
        id: abseil-pin
        with:
          path: AbseilPin/prefix/20260107.1
          key: abseil-pin-20260107.1-win-${{ hashFiles('AbseilPin/CMakeLists.txt', 'AbseilPin/scripts/build_pin.ps1', 'AbseilPin/pins/20260107.1/**') }}
      - name: Build AbseilPin 20260107.1
        if: steps.abseil-pin.outputs.cache-hit != 'true'
        working-directory: AbseilPin
        shell: pwsh
        run: |
          ./scripts/build_pin.ps1 -Pin 20260107.1
      - name: Cache FetchContent deps
        uses: actions/cache@v6
        with:
          path: Volition/build/_deps
          key: volition-deps-win-pin-${{ hashFiles('Volition/CMakeLists.txt', 'Volition/cmake/**', 'MultiProcessShell/CMakeLists.txt', 'MultiProcessShell/cmake/**', 'MultiProcessShell/src/common/CMakeLists.txt') }}
      - name: Configure
        working-directory: Volition
        shell: cmd
        env:
          QTDIR: ${{ env.QT_ROOT_DIR }}
        run: |
          where cl
          where ninja
          cmake -S . -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DVOLITION_DEV_EMBED_MPS=ON ^
            -DVOLITION_DEV_EMBED_QTE=ON ^
            -DVOLITION_DEV_EMBED_QFR=ON ^
            -DMPS_ABSEIL_PIN_PREFIX=%GITHUB_WORKSPACE%/AbseilPin/prefix/20260107.1 ^
            -DVOLITION_PDF_OOP_RENDER=OFF ^
            -DVOLITION_REQUIRE_PDFIUM=OFF ^
            -DVOLITION_BUILD_TESTS=ON ^
            -DFETCHCONTENT_UPDATES_DISCONNECTED=ON
      - name: Build
        working-directory: Volition
        shell: cmd
        env:
          QTDIR: ${{ env.QT_ROOT_DIR }}
        run: cmake --build build --config Release
      - name: Unit tests
        working-directory: Volition
        shell: pwsh
        env:
          QTDIR: ${{ env.QT_ROOT_DIR }}
        run: |
          $env:Path = "$env:QT_ROOT_DIR/bin;$env:Path"
          ctest --test-dir build -C Release --output-on-failure -R volition_client_kind_test
      - name: Smoke bin layout (AbseilPin)
        working-directory: Volition
        shell: pwsh
        run: |
          # PDF Client is skipped when pdfium is not staged (VOLITION_REQUIRE_PDFIUM=OFF).
          ./scripts/smoke_bin_layout.ps1 `
            -BinDir ./build/bin `
            -AbseilPinPrefix "$env:GITHUB_WORKSPACE/AbseilPin/prefix/20260107.1"
